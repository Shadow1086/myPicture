<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程成绩管理-成绩预警</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 36px;
            color: #202124;
            background: #f4f6f8;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .page {
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 24px 28px 30px;
            background: #ffffff;
            border: 1px solid #c9d0d8;
            border-radius: 6px;
            box-shadow: 0 14px 32px rgba(39, 52, 69, 0.12);
        }

        fieldset {
            margin: 0;
            padding: 28px 32px 34px;
            border: 2px solid #30363d;
            border-radius: 4px;
        }

        legend {
            padding: 0 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .student-info,
        .score-info,
        .add-score {
            font-size: 19px;
            line-height: 1.9;
        }

        .student-info {
            margin-top: 6px;
        }

        .score-info {
            margin: 10px 0 16px;
            padding-bottom: 18px;
            border-bottom: 2px solid #30363d;
        }

        .add-score {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 18px;
        }

        input {
            width: 280px;
            height: 40px;
            padding: 7px 10px;
            font-size: 17px;
            border: 2px solid #4a5563;
            border-radius: 3px;
            outline: none;
        }

        input:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.14);
        }

        button {
            min-width: 122px;
            height: 40px;
            padding: 0 16px;
            font-size: 16px;
            border: 2px solid #30363d;
            border-radius: 4px;
            background: #f8fafc;
            cursor: pointer;
        }

        button:hover {
            background: #e9eef5;
        }

        .warning {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 2px solid #30363d;
            font-size: 20px;
        }

        .red {
            color: #d00000;
            font-weight: 700;
        }

        @media (max-width: 620px) {
            body {
                padding: 18px;
            }

            .page {
                padding: 16px;
            }

            fieldset {
                padding: 22px 16px;
            }

            .add-score {
                align-items: stretch;
                flex-direction: column;
            }

            input,
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="page">
        <fieldset>
            <legend>学生成绩信息</legend>

            <div class="student-info">
                学生姓名：{{ student.name }}，年龄：{{ student.age }}，课程平均成绩：<span :class="{ red: isActive }">{{ student.averageScore }}</span>
            </div>

            <div class="score-info">
                课程最高成绩：{{ highScore }}，课程最低成绩：{{ lowScore }}
            </div>

            <div class="add-score">
                <label for="newScore">输入新课程成绩：</label>
                <input id="newScore" type="number" min="0" max="100" v-model.number="newScore">
                <button type="button" @click="addScore">增加课程成绩</button>
            </div>

            <div class="warning">
                <h4 v-show="isActive" class="red">成绩预警：课程平均成绩低于75分，请注意！！</h4>
            </div>
        </fieldset>
    </div>

    <script>
        const { createApp, computed, reactive, ref, watchEffect } = Vue;

        createApp({
            setup() {
                const student = reactive({
                    name: '李小同',
                    age: 22,
                    averageScore: 0
                });
                const score = reactive([100, 56, 78, 98, 76]);
                const newScore = ref(0);
                const isActive = ref(false);

                const averageScore = computed(function () {
                    const total = score.reduce(function (sum, item) {
                        return sum + item;
                    }, 0);

                    return Math.round(total / score.length);
                });

                const highScore = computed(function () {
                    return Math.max(...score);
                });

                const lowScore = computed(function () {
                    return Math.min(...score);
                });

                watchEffect(function () {
                    student.averageScore = averageScore.value;
                    isActive.value = student.averageScore < 75;
                });

                function addScore() {
                    if (!Number.isFinite(newScore.value) || newScore.value < 0 || newScore.value > 100) {
                        alert('请输入 0 到 100 之间的课程成绩');
                        return;
                    }

                    score.push(newScore.value);
                    newScore.value = 0;
                }

                return {
                    student,
                    newScore,
                    isActive,
                    highScore,
                    lowScore,
                    addScore
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
