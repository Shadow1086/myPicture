<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式对象的应用-课程管理</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 36px;
            color: #202124;
            background: #f4f6f8;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .page {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 24px 28px 30px;
            background: #ffffff;
            border: 1px solid #c9d0d8;
            border-radius: 6px;
            box-shadow: 0 14px 32px rgba(39, 52, 69, 0.12);
        }

        fieldset {
            margin: 0;
            padding: 26px 28px 30px;
            border: 2px solid #30363d;
            border-radius: 4px;
        }

        legend {
            padding: 0 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .form-row {
            display: grid;
            grid-template-columns: 96px 1fr;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        label {
            font-size: 18px;
            font-weight: 600;
            text-align: right;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 7px 10px;
            font-size: 17px;
            border: 2px solid #4a5563;
            border-radius: 3px;
            outline: none;
            background: #ffffff;
        }

        input:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.14);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0 18px 108px;
        }

        button {
            min-width: 92px;
            height: 38px;
            padding: 0 16px;
            font-size: 16px;
            border: 2px solid #30363d;
            border-radius: 4px;
            background: #f8fafc;
            cursor: pointer;
        }

        button:hover {
            background: #e9eef5;
        }

        .course-list {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid #30363d;
            font-size: 18px;
            line-height: 1.9;
            text-align: center;
        }

        .empty {
            color: #697586;
        }

        @media (max-width: 560px) {
            body {
                padding: 18px;
            }

            .page {
                padding: 16px;
            }

            fieldset {
                padding: 22px 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            label {
                text-align: left;
            }

            .actions {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div id="app" class="page">
        <fieldset>
            <legend>响应式对象的应用-课程管理</legend>

            <div class="form-row">
                <label for="courseName">课程名称：</label>
                <input id="courseName" type="text" v-model.trim="course.name">
            </div>

            <div class="form-row">
                <label for="teacher">课程教师：</label>
                <input id="teacher" type="text" v-model.trim="course.teacher">
            </div>

            <div class="form-row">
                <label for="classroom">教学场所：</label>
                <input id="classroom" type="text" v-model.trim="course.classroom">
            </div>

            <div class="actions">
                <button type="button" @click="addCourse">增加课程</button>
                <button type="button" @click="clearCourse">清空</button>
            </div>

            <div class="course-list">
                <p v-if="courses.length === 0" class="empty">暂无课程信息</p>
                <p v-for="(item, index) in courses" :key="index">
                    {{ item.name }}-{{ item.teacher }}-{{ item.classroom }}
                </p>
            </div>
        </fieldset>
    </div>

    <script>
        const { createApp, reactive } = Vue;

        createApp({
            setup() {
                const course = reactive({
                    name: '',
                    teacher: '',
                    classroom: ''
                });

                const courses = reactive([]);

                function addCourse() {
                    if (!course.name || !course.teacher || !course.classroom) {
                        alert('请先填写完整的课程名称、课程教师和教学场所');
                        return;
                    }

                    courses.push({
                        name: course.name,
                        teacher: course.teacher,
                        classroom: course.classroom
                    });
                }

                function clearCourse() {
                    course.name = '';
                    course.teacher = '';
                    course.classroom = '';
                    courses.splice(0);
                }

                return {
                    course,
                    courses,
                    addCourse,
                    clearCourse
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
